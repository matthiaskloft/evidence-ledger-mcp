name: Bug report
description: The server returned an error or a misleading result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Do not paste quotes, source or manuscript text, absolute paths, credentials or tokens. Describe the problem in your own words and replace anything private with a placeholder. Agents must not file this report; they suggest it and help you remove private content.
  - type: input
    id: version
    attributes:
      label: Server version
      description: Output of `evidence-ledger-mcp --version` or `pip show evidence-ledger-mcp`.
    validations:
      required: true
  - type: input
    id: schema
    attributes:
      label: Schema version
      description: Result of the `schema_info` tool.
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool that failed or misled, for example `check_ledger`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The error message or the misleading result, with quotes, source text, paths and credentials removed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Prefer a tiny invented ledger over your own data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed quotes, source text, absolute paths, credentials and tokens, or I chose to share them.
          required: true
