name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Check the schema is valid JSON Schema 2020-12
        run: python -c "import json; from jsonschema import Draft202012Validator as V; V.check_schema(json.load(open('schema/evidence-ledger.schema.json', encoding='utf-8')))"
