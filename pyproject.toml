[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-ledger-mcp"
version = "0.1.0"
description = "MCP server through which agents write and check evidence ledgers for the citations in a work."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Matthias Kloft" },
]
requires-python = ">=3.11"
keywords = ["mcp", "citations", "evidence", "research", "active-citation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.28,<2",
  "jsonschema>=4.23",
  "pypdf>=6.21.4,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pyyaml>=6.0",
  "ruff>=0.15,<0.16",
  "mypy>=1.19,<2",
  "types-jsonschema",
]

[project.scripts]
evidence-ledger-mcp = "evidence_ledger_mcp.server:main"

[project.urls]
Homepage = "https://github.com/matthiaskloft/evidence-ledger-mcp"
Issues = "https://github.com/matthiaskloft/evidence-ledger-mcp/issues"
Changelog = "https://github.com/matthiaskloft/evidence-ledger-mcp/blob/main/CHANGELOG.md"
Schema = "https://github.com/matthiaskloft/evidence-ledger-schema"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_ledger_mcp"]

# schema/ vendors an upstream release; the wheel carries the schema and its licence.
[tool.hatch.build.targets.wheel.force-include]
"schema/evidence-ledger.schema.json" = "evidence_ledger_mcp/evidence-ledger.schema.json"
"schema/LICENSE" = "evidence_ledger_mcp/SCHEMA-LICENSE"

[tool.hatch.build.targets.sdist]
include = ["/src", "/schema", "/tests", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src/evidence_ledger_mcp", "tests", "tools"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs internet access; deselected by default"]
